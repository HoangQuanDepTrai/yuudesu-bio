<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hoàng Quân | Digital Bio & 2048</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            background-image: radial-gradient(circle at top left, rgba(58, 123, 213, 0.2) 0%, transparent 40%),
                              radial-gradient(circle at bottom right, rgba(0, 210, 255, 0.15) 0%, transparent 40%);
            color: white;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* 2048 Container - Quan trọng: touch-action: none để vuốt được */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 12px;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            touch-action: none; 
            user-select: none;
        }
        .tile {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            transition: all 0.15s ease-in-out;
            background: rgba(255, 255, 255, 0.05);
        }
        /* Colors */
        .tile-2 { background: #1e293b; color: #94a3b8; }
        .tile-4 { background: #334155; color: #cbd5e1; }
        .tile-8 { background: #0ea5e9; color: white; box-shadow: 0 0 10px rgba(14, 165, 233, 0.4); }
        .tile-16 { background: #0284c7; color: white; }
        .tile-32 { background: #f43f5e; color: white; }
        .tile-64 { background: #e11d48; color: white; }
        .tile-128 { background: #eab308; color: white; font-size: 16px; box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
        .tile-256 { background: #d97706; color: white; font-size: 16px; }
        .tile-512 { background: #8b5cf6; color: white; font-size: 16px; }
        .tile-1024 { background: #7c3aed; color: white; font-size: 14px; }
        .tile-2048 { background: #22c55e; color: white; font-size: 14px; box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
    </style>
</head>
<body class="flex flex-col items-center py-10 px-6">

    <header class="text-center mb-8" data-aos="fade-down">
        <div class="relative inline-block mb-4">
            <img src="https://ui-avatars.com/api/?name=Hoang+Quan&background=0ea5e9&color=fff&size=150" 
                 class="w-24 h-24 rounded-full border-4 border-sky-500/20 shadow-xl">
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight">Hoàng Quân</h1>
        <p class="text-sky-400 font-semibold text-[10px] uppercase tracking-[0.2em]">IT Student • Cần Thơ</p>
    </header>

    <main class="w-full max-w-sm space-y-3 mb-10">
        <a href="#" class="glass flex items-center p-4 rounded-2xl hover:bg-white/5 transition-all" data-aos="fade-up">
            <i data-lucide="github" class="w-5 h-5 text-slate-400"></i>
            <span class="ml-4 font-bold text-sm text-slate-200">GitHub Projects</span>
        </a>
        <a href="#" class="glass flex items-center p-4 rounded-2xl hover:bg-white/5 transition-all" data-aos="fade-up" data-aos-delay="100">
            <i data-lucide="facebook" class="w-5 h-5 text-blue-400"></i>
            <span class="ml-4 font-bold text-sm text-slate-200">Facebook</span>
        </a>
    </main>

    <section class="w-full max-w-sm" data-aos="fade-up" data-aos-delay="200">
        <div class="glass p-5 rounded-[2.5rem] border-sky-500/10">
            <div class="flex justify-between items-end mb-4 px-2">
                <div>
                    <h3 class="text-[10px] font-black text-sky-500 uppercase italic">Digital Puzzle</h3>
                    <p class="text-lg font-extrabold">2048 Edition</p>
                </div>
                <div class="bg-white/5 px-4 py-1 rounded-full text-right">
                    <p class="text-[8px] text-slate-500 uppercase font-bold">Score</p>
                    <span id="game-score" class="text-md font-black">0</span>
                </div>
            </div>

            <div class="relative">
                <div id="grid" class="grid-container"></div>
                
                <div id="game-over" class="absolute inset-0 bg-black/90 rounded-xl flex flex-col items-center justify-center hidden z-20">
                    <p class="text-sky-400 font-bold text-xs mb-1 uppercase tracking-widest">Kết thúc!</p>
                    <h2 class="text-3xl font-black mb-6">GAME OVER</h2>
                    <button onclick="initGame()" class="bg-sky-500 text-white px-8 py-3 rounded-full font-bold shadow-lg shadow-sky-500/30 active:scale-95 transition-all">CHƠI LẠI</button>
                </div>
            </div>
            <p class="text-center text-[10px] text-slate-500 mt-4 font-bold uppercase tracking-widest">Vuốt sang các hướng để ghép</p>
        </div>
    </section>

    <script>
        lucide.createIcons();
        AOS.init({ duration: 800, once: true });

        const gridDisplay = document.getElementById('grid');
        const scoreDisplay = document.getElementById('game-score');
        const gameOverDisplay = document.getElementById('game-over');
        let width = 4;
        let squares = [];
        let score = 0;

        function initGame() {
            gridDisplay.innerHTML = '';
            squares = [];
            score = 0;
            scoreDisplay.innerHTML = 0;
            gameOverDisplay.classList.add('hidden');
            for (let i = 0; i < width * width; i++) {
                let square = document.createElement('div');
                square.className = 'tile';
                gridDisplay.appendChild(square);
                squares.push(square);
            }
            generate(); generate();
        }

        function generate() {
            let available = squares.filter(s => s.innerHTML === "");
            if (available.length > 0) {
                let randomSquare = available[Math.floor(Math.random() * available.length)];
                randomSquare.innerHTML = 2;
                updateStyles();
                checkForGameOver();
            }
        }

        function updateStyles() {
            squares.forEach(square => {
                const val = square.innerHTML;
                square.className = 'tile' + (val ? ` tile-${val}` : '');
            });
        }

        // Logic di chuyển (Giữ nguyên và tối ưu)
        function slide(row) {
            let arr = row.filter(num => num);
            let missing = 4 - arr.length;
            return row.some(n => n !== 0) ? (arguments[1] === 'left' ? arr.concat(Array(missing).fill(0)) : Array(missing).fill(0).concat(arr)) : row;
        }

        function combine(row) {
            for (let i = 0; i < 3; i++) {
                if (row[i] === row[i+1] && row[i] !== 0) {
                    row[i] = row[i] * 2;
                    row[i+1] = 0;
                    score += row[i];
                    scoreDisplay.innerHTML = score;
                }
            }
            return row;
        }

        function move(direction) {
            let hasChanged = false;
            for (let i = 0; i < 4; i++) {
                let line = [];
                for (let j = 0; j < 4; j++) {
                    line.push(parseInt(squares[direction === 'left' || direction === 'right' ? (i * 4 + j) : (j * 4 + i)].innerHTML) || 0);
                }

                let oldLine = [...line];
                if (direction === 'right' || direction === 'down') line.reverse();
                line = slide(combine(slide(line, 'left')), 'left');
                if (direction === 'right' || direction === 'down') line.reverse();

                for (let j = 0; j < 4; j++) {
                    let idx = direction === 'left' || direction === 'right' ? (i * 4 + j) : (j * 4 + i);
                    squares[idx].innerHTML = line[j] || "";
                    if (oldLine[j] !== line[j]) hasChanged = true;
                }
            }
            if (hasChanged) generate();
            updateStyles();
        }

        // Control Keys
        document.addEventListener('keyup', e => {
            if (e.keyCode === 37) move('left');
            else if (e.keyCode === 38) move('up');
            else if (e.keyCode === 39) move('right');
            else if (e.keyCode === 40) move('down');
        });

        // --- FIX VUỐT TRÊN ĐIỆN THOẠI ---
        let startX, startY;
        gridDisplay.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, {passive: false});

        gridDisplay.addEventListener('touchmove', e => {
            e.preventDefault(); // CHẶN CUỘN TRANG KHI ĐANG VUỐT GAME
        }, {passive: false});

        gridDisplay.addEventListener('touchend', e => {
            if (!startX || !startY) return;
            let diffX = e.changedTouches[0].clientX - startX;
            let diffY = e.changedTouches[0].clientY - startY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 30) move(diffX > 0 ? 'right' : 'left');
            } else {
                if (Math.abs(diffY) > 30) move(diffY > 0 ? 'down' : 'up');
            }
            startX = null; startY = null;
        });

        function checkForGameOver() {
            let zeros = squares.filter(s => s.innerHTML === "").length;
            if (zeros === 0) {
                // Kiểm tra xem còn nước đi nào không
                // (Đơn giản hóa: hiện thông báo thua nếu đầy ô và không generate được tiếp)
                gameOverDisplay.classList.remove('hidden');
            }
        }

        initGame();
    </script>
</body>
</html>
