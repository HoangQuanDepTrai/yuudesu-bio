<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huu Duy | Software Engineer Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            --primary-gradient: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: #1d1d1f;
        }

        .bento-card {
            border: none;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .bento-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .bg-gradient-primary {
            background: var(--primary-gradient);
        }

        .hover-scale {
            transition: transform 0.3s ease;
        }

        .hover-scale:hover {
            transform: scale(1.05);
        }

        .btn-bento {
            background: #f5f5f7;
            border-radius: 16px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-bento:hover {
            background: #fff;
            border-color: #0d6efd;
            color: #0d6efd;
        }

        .badge-skill {
            background: #e9ecef;
            color: #495057;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
        }

        /* Animation cho xịn */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeInUp 0.6s ease-out forwards;
        }
    </style>
</head>

<body class="py-5 d-flex align-items-center min-vh-100">

    <div class="container animate-in" style="max-width: 700px;">
        <div class="row g-3">
            
            <div class="col-md-8 col-12">
                <div class="card bento-card p-4 h-100 d-flex flex-column justify-content-center">
                    <h1 class="fw-800 mb-2">Hữu Duy <span class="text-primary">.</span></h1>
                    <p class="text-secondary mb-0">Software Engineering Student. <br> Thích build mấy thứ lỏ nhưng chạy ngon.</p>
                </div>
            </div>

            <div class="col-md-4 col-12 text-center">
                <div class="card bento-card h-100 bg-gradient-primary d-flex align-items-center justify-content-center p-4">
                    <img src="https://ui-avatars.com/api/?name=Huu+Duy&background=fff&color=0d6efd&size=128" 
                         class="rounded-circle shadow-lg hover-scale" style="width: 80px; height: 80px;" alt="Avatar">
                </div>
            </div>

            <div class="col-12">
                <div class="card bento-card p-4">
                    <h6 class="fw-bold mb-3 text-uppercase small text-muted">Kỹ năng hiện có</h6>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="badge-skill">Java & Spring Boot</span>
                        <span class="badge-skill">Bootstrap 5</span>
                        <span class="badge-skill">JavaScript</span>
                        <span class="badge-skill">SQL Server</span>
                        <span class="badge-skill">Git / GitHub</span>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <a href="#" class="card bento-card p-4 text-center text-decoration-none h-100">
                    <i class="fa-brands fa-facebook fa-2x text-primary mb-2"></i>
                    <div class="small fw-bold text-dark">Facebook</div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="#" class="card bento-card p-4 text-center text-decoration-none h-100">
                    <i class="fa-brands fa-instagram fa-2x text-danger mb-2"></i>
                    <div class="small fw-bold text-dark">Instagram</div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="https://github.com/hoangquandeptrai" class="card bento-card p-4 text-center text-decoration-none h-100">
                    <i class="fa-brands fa-github fa-2x text-dark mb-2"></i>
                    <div class="small fw-bold text-dark">GitHub</div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="mailto:contact@yuudesu.id.vn" class="card bento-card p-4 text-center text-decoration-none h-100">
                    <i class="fa-solid fa-envelope fa-2x text-warning mb-2"></i>
                    <div class="small fw-bold text-dark">Email</div>
                </a>
            </div>

            <div class="col-12">
                <a href="#" class="card bento-card p-3 d-flex flex-row align-items-center text-decoration-none bg-dark text-white hover-lift">
                    <div class="bg-primary rounded-3 p-2 me-3">
                        <i class="fa-solid fa-ticket-alt"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="fw-bold">Hữu Duy Cinema</div>
                        <div class="small opacity-50">Web đặt vé xem phim xịn sò</div>
                    </div>
                    <i class="fa-solid fa-arrow-right-long me-2"></i>
                </a>
            </div>

            <div class="col-12 text-center mt-3">
                <p class="small text-muted fw-bold">© 2026 HUU DUY | BUILD WITH BOOTSTRAP 5</p>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
