    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Slide show Hero */
        .hero-swiper {
            width: 100%;
            height: 65vh;
            border-radius: 0 0 3.5rem 3.5rem;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Gallery Pro - Tự động nhảy bố cục */
        #gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 140px;
            gap: 12px;
            grid-auto-flow: dense;
        }

        @media (min-width: 768px) {
            #gallery {
                grid-template-columns: repeat(4, 1fr);
                grid-auto-rows: 180px;
                margin-left: -5rem;
                margin-right: -5rem;
                /* Tràn lề trên PC */
            }
        }

        .gallery-item {
            border-radius: 24px;
            overflow: hidden;
            background: #e2e8f0;
            transition: all 0.4s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .gallery-item.h-stretch {
            grid-column: span 2;
        }

        .gallery-item.v-stretch {
            grid-row: span 2;
        }

        .gallery-item.big {
            grid-column: span 2;
            grid-row: span 2;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* Game 2048 Style */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #cbd5e1;
            padding: 10px;
            border-radius: 20px;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            touch-action: none;
        }

        .tile {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            background: #f1f5f9;
            transition: all 150ms ease;
        }

        .tile-2 {
            background: #bae6fd;
            color: #0369a1;
        }

        .tile-2048 {
            background: #0ea5e9;
            color: white;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
        }
    </style>
</head>

            <div id="video-gallery" class="space-y-10 mb-20" data-aos="fade-up">

            <script>const videoList = [
                    { id: "hrf0l4", type: "landscape" },
                    { id: "5HVJnVJOO6KztdPKaCcd", type: "landscape", source: "jumpshare" },
                    { id: "0rtviw", type: "portrait" },
                    { id: "hn1zeh", type: "landscape" },
                    { id: "688xhq", type: "landscape" },
                    { id: "a3wt1g", type: "portrait" },
                    { id: "8hsuhk", type: "ultrawide" },
                    { id: "75rj66", type: "landscape" },
                    { id: "l7tklv", type: "landscape" },
                    { id: "n5jz4w", type: "landscape" },
                    { id: "ykcok4", type: "landscape" }
                ];

                function renderVideos() {
                    const container = document.getElementById('video-gallery');
                    if (!container) return;

                    const html = videoList.map(video => {
                        const url = video.source === "jumpshare"
                            ? `https://jumpshare.com/embed/${video.id}`
                            : `https://streamable.com/e/${video.id}?quality=highest`;

                        let aspectClass = "aspect-video";
                        let widthClass = "w-full";

                        if (video.type === "portrait") {
                            aspectClass = "aspect-[9/16]";
                            widthClass = "w-full md:w-2/3 mx-auto";
                        } else if (video.type === "ultrawide") {
                            aspectClass = "aspect-[21/9]";
                        }

                        return `
            <div class="relative group" data-aos="fade-up">
                <div class="absolute -inset-1 bg-gradient-to-r from-sky-400 to-blue-500 rounded-[2.5rem] blur opacity-10 group-hover:opacity-25 transition duration-1000"></div>
                
                <div class="relative glass-card overflow-hidden rounded-[2.5rem] shadow-xl group transition-all duration-500 hover:shadow-sky-500/10 ${widthClass}">
                    <div class="relative ${aspectClass}">
                        <iframe src="${url}" frameborder="0" allowfullscreen class="absolute top-0 left-0 w-full h-full object-cover"></iframe>
                    </div>
                    
                    <div class="absolute bottom-4 left-6 flex items-center space-x-2 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                        <div class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div>
                        <span class="text-[8px] font-black text-white uppercase tracking-[0.2em] drop-shadow-md">Cinema Reel</span>
                    </div>
                </div>
            </div>
        `;
                    }).join('');

                    container.innerHTML = html;

                    // Cập nhật số lượng lên bảng thống kê (vẫn giữ chức năng này cho Quân)
                    const videoCountEl = document.getElementById('video-count');
                    if (videoCountEl) videoCountEl.innerText = videoList.length;
                }

                window.addEventListener('DOMContentLoaded', renderVideos);</script>

    <script>

        function updateStats() {
            // 1. Đếm ảnh trong Gallery
            const galleryImages = document.querySelectorAll('#gallery img');
            const photoCountElement = document.getElementById('photo-count');
            if (photoCountElement) {
                photoCountElement.innerText = galleryImages.length;
            }

            // 2. Đếm Video (bao gồm cả Iframe Jumpshare và các thẻ video khác)
            // Mình sẽ tìm tất cả iframe và thẻ video trong trang
            const totalVideos = document.querySelectorAll('iframe, video').length;
            const videoCountElement = document.getElementById('video-count');
            if (videoCountElement) {
                // Trừ đi 1 nếu Quân dùng Iframe làm nền Slide show (vì đó không phải video nội dung)
                // Nếu không dùng iframe làm nền thì giữ nguyên totalVideos
                videoCountElement.innerText = totalVideos;
            }
        }

        // Chạy hàm đếm khi trang đã load xong
        window.addEventListener('DOMContentLoaded', updateStats);

        const swiper = new Swiper('.hero-swiper', {
            loop: true,
            effect: 'fade',
            fadeEffect: { crossFade: true },
            autoplay: {
                delay: 5000, // Thời gian trượt giữa các slide ảnh (5 giây)
                disableOnInteraction: true, // QUAN TRỌNG: Dừng tự động trượt khi người dùng bấm vào Slide/Video
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true
            }
        });

        // Init Icons & AOS
        lucide.createIcons();
        AOS.init({ duration: 1000, once: true });

        // Init Swiper
        new Swiper('.hero-swiper', { loop: true, autoplay: { delay: 4000 }, pagination: { el: '.swiper-pagination', clickable: true } });

        // 1. TỰ ĐỘNG ĐẾM ẢNH (TRỪ BG)
        function updatePhotoStats() {
            const galleryImages = document.querySelectorAll('#gallery img');
            const countElement = document.getElementById('photo-count');
            if (countElement) countElement.innerText = galleryImages.length;
        }

        // 2. TỰ ĐỘNG LAYOUT GALLERY THEO KÍCH THƯỚC ẢNH
        function applyAutoLayout() {
            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => {
                const img = item.querySelector('img');
                const update = () => {
                    const aspect = img.naturalWidth / img.naturalHeight;
                    if (aspect > 1.3) item.classList.add('h-stretch'); // Ngang
                    else if (aspect < 0.75) item.classList.add('v-stretch'); // Đứng
                    if (Math.random() > 0.8) item.classList.add('big'); // Random ảnh đại
                };
                if (img.complete) update(); else img.onload = update;
            });
        }

        // --- 2048 LOGIC ---
        const gridDisplay = document.getElementById('grid');
        const scoreDisplay = document.getElementById('game-score');
        const gameOverDisplay = document.getElementById('game-over');
        let squares = [], score = 0;

        function initGame() {
            gridDisplay.innerHTML = ''; squares = []; score = 0;
            scoreDisplay.innerHTML = 0; gameOverDisplay.classList.add('hidden');
            for (let i = 0; i < 16; i++) {
                let square = document.createElement('div'); square.className = 'tile';
                gridDisplay.appendChild(square); squares.push(square);
            }
            generate(); generate();
        }

        function generate() {
            let empty = squares.filter(s => s.innerHTML === "");
            if (empty.length > 0) { empty[Math.floor(Math.random() * empty.length)].innerHTML = 2; updateStyles(); }
        }

        function updateStyles() {
            squares.forEach(s => {
                const val = s.innerHTML;
                s.className = 'tile' + (val ? ` tile-${val}` : '');
            });
        }

        function move(dir) {
            let hasChanged = false;
            for (let i = 0; i < 4; i++) {
                let line = [];
                for (let j = 0; j < 4; j++) {
                    let idx = (dir === 'left' || dir === 'right') ? (i * 4 + j) : (j * 4 + i);
                    line.push(parseInt(squares[idx].innerHTML) || 0);
                }
                let oldLine = [...line];
                let rev = (dir === 'right' || dir === 'down');
                if (rev) line.reverse();
                line = line.filter(n => n);
                for (let k = 0; k < line.length - 1; k++) {
                    if (line[k] === line[k + 1]) { line[k] *= 2; line[k + 1] = 0; score += line[k]; scoreDisplay.innerHTML = score; }
                }
                line = line.filter(n => n);
                while (line.length < 4) line.push(0);
                if (rev) line.reverse();
                for (let j = 0; j < 4; j++) {
                    let idx = (dir === 'left' || dir === 'right') ? (i * 4 + j) : (j * 4 + i);
                    squares[idx].innerHTML = line[j] || "";
                    if (oldLine[j] !== line[j]) hasChanged = true;
                }
            }
            if (hasChanged) generate(); else if (squares.filter(s => s.innerHTML === "").length === 0) gameOverDisplay.classList.remove('hidden');
            updateStyles();
        }

        // Swipe & Keys
        let sX, sY;
        gridDisplay.addEventListener('touchstart', e => { sX = e.touches[0].clientX; sY = e.touches[0].clientY; }, { passive: false });
        gridDisplay.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        gridDisplay.addEventListener('touchend', e => {
            if (!sX || !sY) return;
            let dx = e.changedTouches[0].clientX - sX, dy = e.changedTouches[0].clientY - sY;
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
            sX = null; sY = null;
        });

        // Run all
        window.addEventListener('load', () => { updatePhotoStats(); applyAutoLayout(); initGame(); });
    </script>
