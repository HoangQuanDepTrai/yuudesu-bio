    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            color: #212529;
            display: flex;
            align-items: center;
            min-height: 100vh;
        }

        .bio-card {
            max-width: 450px;
            width: 100%;
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .bio-card:hover {
            transform: translateY(-5px);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: -50px;
        }

        .btn-link-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid #e9ecef;
            background-color: #fff;
            color: #495057;
            margin-bottom: 12px;
        }

        .btn-link-custom:hover {
            background-color: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
        }

        .btn-link-custom i {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .social-icons a {
            font-size: 1.5rem;
            color: #adb5bd;
            transition: color 0.2s;
            margin: 0 10px;
        }

        .social-icons a:hover {
            color: #0d6efd;
        }

        .badge-skill {
            background-color: #e9ecef;
            color: #495057;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            margin: 2px;
        }
    </style>
