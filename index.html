<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Vé Hay Là Nhịn - Hữu Duy Cinema</title>
    <style>
        /* CSS CHƠI HỆ CỤC SÚC */
        :root {
            --primary: #ff0055;
            --bg: #0f0f0f;
            --seat-empty: #444;
            --seat-selected: #00ff88;
            --seat-occupied: #222;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        h1 { margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); }
        p.subtitle { margin-top: 0; font-size: 14px; color: #888; font-style: italic; }

        /* MÀN HÌNH */
        .screen {
            background-color: #fff;
            height: 70px;
            width: 100%;
            max-width: 400px;
            margin: 30px 0;
            transform: rotateX(-45deg);
            box-shadow: 0 3px 20px rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            text-align: center;
            color: #000;
            line-height: 70px;
            font-weight: bold;
        }

        /* PHÒNG VÉ */
        .container { perspective: 1000px; margin-bottom: 30px; }

        .row { display: flex; justify-content: center; }

        .seat {
            background-color: var(--seat-empty);
            height: 20px;
            width: 25px;
            margin: 5px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .seat:hover { transform: scale(1.2); background-color: #666; }

        .seat.selected { background-color: var(--seat-selected); box-shadow: 0 0 10px var(--seat-selected); }

        .seat.occupied { background-color: var(--seat-occupied); cursor: not-allowed; }

        /* CHÚ THÍCH */
        .showcase {
            list-style-type: none;
            display: flex;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
        }

        .showcase li { display: flex; align-items: center; margin: 0 10px; font-size: 12px; }
        .showcase li .seat { cursor: default; margin-right: 5px; }

        /* TỔNG TIỀN */
        .total-box { font-size: 18px; font-weight: bold; }
        #total { color: var(--primary); font-size: 24px; }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--primary);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--primary); }
    </style>
</head>
<body>

    <h1>HỮU DUY CINEMA</h1>
    <p class="subtitle">Đéo đặt vé thì đi về, đừng có nhìn!</p>

    <ul class="showcase">
        <li><div class="seat"></div> <small>Còn trống</small></li>
        <li><div class="seat selected"></div> <small>Đang chọn</small></li>
        <li><div class="seat occupied"></div> <small>Hết chỗ</small></li>
    </ul>

    <div class="container">
        <div class="screen">MÀN HÌNH ĐÂY EM</div>

        <div class="row">
            <div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div>
        </div>
        <div class="row">
            <div class="seat"></div><div class="seat occupied"></div><div class="seat occupied"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div>
        </div>
        <div class="row">
            <div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat occupied"></div><div class="seat"></div>
        </div>
        <div class="row">
            <div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div>
        </div>
    </div>

    <div class="total-box">
        Đã chọn <span id="count">0</span> ghế. Tổng tiền: <span id="total">0</span> VNĐ
    </div>

    <button onclick="bookTicket()">Đặt Vé Ngay!</button>

    <script>
        const container = document.querySelector('.container');
        const seats = document.querySelectorAll('.row .seat:not(.occupied)');
        const count = document.getElementById('count');
        const total = document.getElementById('total');
        const ticketPrice = 90000; // Giá vé 90k cho nó rẻ

        // Hàm cập nhật số lượng và tiền
        function updateSelectedCount() {
            const selectedSeats = document.querySelectorAll('.row .seat.selected');
            const selectedSeatsCount = selectedSeats.length;
            
            count.innerText = selectedSeatsCount;
            total.innerText = (selectedSeatsCount * ticketPrice).toLocaleString('vi-VN');
        }

        // Sự kiện click chọn ghế
        container.addEventListener('click', (e) => {
            if (e.target.classList.contains('seat') && !e.target.classList.contains('occupied')) {
                e.target.classList.toggle('selected');
                updateSelectedCount();
            }
        });

        // Nút đặt vé ảo ma
        function bookTicket() {
            const selectedCount = document.querySelectorAll('.row .seat.selected').length;
            if (selectedCount > 0) {
                alert('Chúc mừng em đã tốn ' + (selectedCount * ticketPrice).toLocaleString('vi-VN') + ' VNĐ cho đại ca Duy!');
                location.reload(); // Đặt xong cho load lại trang luôn
            } else {
                alert('Mày đéo chọn ghế thì đặt cái gì?');
            }
        }
    </script>

</body>
</html>
