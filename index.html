<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hữu Duy Bio</title>
    <style>
        /* CSS LỎ CHO HỮU DUY */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Màu nền gradient cho nó sang */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #764ba2;
            margin: 0 auto 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
            font-weight: bold;
            border: 4px solid #f0f2f5;
        }

        h1 {
            margin: 10px 0;
            font-size: 24px;
            color: #333;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 1.5rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-btn {
            text-decoration: none;
            background: #f8f9fa;
            color: #333;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid #ddd;
        }

        .link-btn:hover {
            background: #764ba2;
            color: white;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">HD</div>
        <h1>Hữu Duy</h1>
        <p>Chào mừng đến với trang cá nhân của bố!!</p>
        
        <div class="links">
            <a href="#" class="link-btn" target="_blank">Facebook</a>
            <a href="#" class="link-btn" target="_blank">Zalo</a>
            <a href="#" class="link-btn" target="_blank">Instagram</a>
            <a href="https://github.com/hoangquandeptrai" class="link-btn" target="_blank">GitHub của tui</a>
        </div>
    </div>

</body>
</html>
